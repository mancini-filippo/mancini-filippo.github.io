name: Publish academic website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Configure public address
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: >-
          ruby -ryaml -ruri -e 'u = URI(ENV.fetch("PAGES_URL"));
          File.write("_config.github.yml", {"url" => "#{u.scheme}://#{u.host}", "baseurl" => u.path.sub(%r{/$}, "")}.to_yaml)'
      - name: Build website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --config _config.yml,_config.github.yml --destination _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
